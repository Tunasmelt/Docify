[project]
name = "docify-api"
version = "0.1.0"
description = "Docify FastAPI backend — ingestion, retrieval, generation"
requires-python = ">=3.12,<3.13"
license = "MIT"
# Version floors/caps below carry a short reason where they're not arbitrary.
# Full history for each bump is in CHANGELOG.md (dates noted inline).
dependencies = [
    # Security floor (2026-07-23): starlette>=1.3.1 clears all known CVEs;
    # fastapi 0.133 is the minimum compatible with it.
    "fastapi>=0.133,<0.134",
    # Declared explicitly: middleware/auth.py imports starlette directly.
    "starlette>=1.3.1,<1.4",
    "uvicorn[standard]>=0.30,<0.31",
    # Document parsing (FEAT-027, replaced Docling, whose memory use OOM-crashed
    # Render's 512MB tier). pdfplumber (MIT) chosen over PyMuPDF (AGPL-3.0).
    "pdfplumber>=0.11,<0.12",
    "python-docx>=1.1,<2.0",
    "python-pptx>=1.0,<2.0",
    "selectolax>=0.4,<0.5",
    # Floor = version FEAT-006 was tested against; stops the resolver from
    # downgrading voyageai to satisfy the langsmith CVE constraint below.
    "voyageai>=0.3.7,<0.4",
    # Imported directly by services/embedder.py to honor Voyage's retry-after
    # header (2026-08-18 incident fix).
    "tenacity>=9.1,<10.0",
    # Generation, verification, OCR tier 1, and the embedding fallback.
    # 1.7 is the minimum compatible with websockets>=15 (required by the
    # langsmith CVE fix).
    "google-genai>=1.7,<1.8",
    "supabase>=2.7,<3.0",
    "pydantic>=2.8,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pyjwt[crypto]>=2.9,<3.0",
    # Security floor (2026-07-23).
    "pillow>=12.3.0,<12.4",
    # OCR tier 3. Wraps the system `tesseract-ocr` binary, which must be
    # installed separately (the Dockerfile does this; see docs/DEVELOPMENT.md).
    "pytesseract>=0.3.13,<0.4",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    # Security floor (PYSEC-2026-1845).
    "pytest>=9.0.3,<9.1",
    # Moved with pytest (0.24 capped pytest<9).
    "pytest-asyncio>=1.4,<1.5",
    "httpx>=0.28,<0.29",
    "psycopg[binary]>=3.2,<4.0",
    # Used by the parser memory-regression tests.
    "psutil>=7.0,<8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# Tests that need the public internet (not just local Supabase) are skipped
# unless selected explicitly: `pytest -m network`.
markers = ["network: needs outbound internet access (e.g. a Hugging Face download)"]
addopts = "-m 'not network'"

[tool.uv]
# langsmith is transitive only (voyageai -> langchain-text-splitters ->
# langchain-core -> langsmith) and never imported here. This constraint
# forces a patched version (GHSA-f4xh-w4cj-qxq8) without declaring it as a
# direct dependency.
constraint-dependencies = ["langsmith>=0.8.18"]
